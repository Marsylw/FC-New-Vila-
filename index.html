<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FC New Vila</title>
<meta name="description" content="Plataforma oficial do clube FC New Vila com gestão de jogos, plantel e perfil de atletas.">
<meta property="og:title" content="FC New Vila">
<meta property="og:description" content="Plataforma oficial do clube FC New Vila com gestão de jogos, plantel e perfil de atletas.">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#152a52; --navy-dark:#0e1d3a; --gold:#c9a227;
    --bg:#f6f6f4; --card:#ffffff; --text:#1c1c1c; --muted:#6b7280; --border:#e4e2dc;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#101418; --card:#181c22; --text:#eceef1; --muted:#9aa1ac; --border:#2a2f37; }
  }
  :root[data-theme="dark"]{ --bg:#101418; --card:#181c22; --text:#eceef1; --muted:#9aa1ac; --border:#2a2f37; }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  header{
    background:var(--navy); color:#fff; display:flex; align-items:center; gap:10px;
    padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px));
    position:sticky; top:0; z-index:5;
  }
  header img{width:32px; height:32px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,0.3);}
  header h1{font-size:15px; font-weight:600; margin:0;}
  header a.nav-link{color:#cfd6e4; font-size:12px; text-decoration:none; margin-left:12px;}
  header a.nav-link:hover{color:#fff;}
  nav{display:flex; gap:2px; background:var(--navy-dark); overflow-x:auto;}
  nav button{background:transparent; border:none; color:#cfd6e4; padding:11px 14px; font-size:13px; cursor:pointer; white-space:nowrap; border-bottom:2px solid transparent;}
  nav button.active{color:#fff; border-bottom:2px solid var(--gold);}
  main{max-width:620px; margin:0 auto; padding:16px; padding-bottom:40px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px;}
  .card h2{font-size:13px; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid var(--gold); text-transform:uppercase; letter-spacing:.03em; color:var(--muted);}
  .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat{flex:1; min-width:130px; text-align:center; padding:14px 8px; border:1px solid var(--border); border-radius:8px;}
  .stat b{display:block; font-size:22px; color:var(--navy);}
  :root[data-theme="dark"] .stat b, @media (prefers-color-scheme:dark){ .stat b{color:var(--gold);} }
  .stat span{font-size:11px; color:var(--muted);}
  .proximo{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .proximo .data{background:var(--navy); color:#fff; border-radius:8px; padding:8px 12px; text-align:center; min-width:56px;}
  .proximo .data b{display:block; font-size:17px;}
  .proximo .data span{font-size:10px; text-transform:uppercase;}
  .proximo .info b{display:block; font-size:14px;}
  .proximo .info span{font-size:12px; color:var(--muted);}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--border);}
  th{color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase;}
  .jogador-cell{display:flex; align-items:center; gap:8px;}
  .jogador-cell img{width:26px; height:26px; border-radius:50%; object-fit:cover; background:#eee;}
  .tab{display:none;}
  .tab.active{display:block;}
  .vazio{color:var(--muted); font-size:13px;}
</style>
</head>
<body>

<header>
  <img src="/logo.jpg" alt="FC New Vila" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22 viewBox=%220 0 32 32%22><circle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%23152a52%22/><text x=%2216%22 y=%2220%22 font-size=%2210%22 fill=%22%23c9a227%22 text-anchor=%22middle%22>NV</text></svg>'">
  <h1>FC New Vila</h1>
  <div style="margin-left:auto; display:flex; align-items:center;">
    <a href="/perfil" class="nav-link">O meu perfil</a>
    <a href="/admin" class="nav-link">Painel</a>
  </div>
</header>
<nav id="nav">
  <button data-tab="home" class="active">Início</button>
  <button data-tab="jogos">Jogos</button>
  <button data-tab="plantel">Plantel</button>
</nav>
<main>

  <section id="tab-home" class="tab active">
    <div class="card">
      <h2>Resumo</h2>
      <div class="stats">
        <div class="stat"><b id="s-jogadores">—</b><span>jogadores</span></div>
        <div class="stat"><b id="s-pagos">—</b><span>já pagaram equipamento</span></div>
      </div>
    </div>
    <div class="card">
      <h2>Próximo jogo</h2>
      <div id="proximo-jogo-box"><div id="proximo-jogo" class="vazio">Sem jogos marcados.</div></div>
    </div>
  </section>

  <section id="tab-jogos" class="tab">
    <div class="card">
      <h2>Jogos marcados</h2>
      <div class="tablewrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Adversário</th><th>Local</th><th>Resultado</th></tr></thead>
      <tbody id="jogos-tbody"><tr><td colspan="5" class="vazio">Sem jogos marcados.</td></tr></tbody></table></div>
    </div>
  </section>

  <section id="tab-plantel" class="tab">
    <div class="card">
      <h2>Plantel</h2>
      <div class="tablewrap"><table><thead><tr><th>Jogador</th><th>Posição</th><th>Nº</th></tr></thead>
      <tbody id="plantel-tbody"><tr><td colspan="3" class="vazio">Sem jogadores.</td></tr></tbody></table></div>
    </div>
  </section>

</main>

<script>
const SUPABASE_URL = 'https://dnpomwkwpxagiecnqjpt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DTbIm2GgS9iNBYqNTirpLA_8Wdin2ND';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const LOGO = '/logo.jpg';

document.getElementById('nav').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
});

const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function formatarData(iso){
  const [y,m,d] = iso.split('-');
  return { dia: d, mes: MESES[parseInt(m,10)-1] };
}

async function carregar(){
  const hoje = new Date().toISOString().slice(0,10);

  // Jogadores + plantel
  const { data: jogadores } = await sb.from('jogadores').select('*').order('nome');
  if(jogadores){
    document.getElementById('s-jogadores').textContent = jogadores.length;
    if(jogadores.length){
      document.getElementById('plantel-tbody').innerHTML = jogadores.map(j => `
        <tr><td><div class="jogador-cell"><img src="${j.foto_url || LOGO}" onerror="this.src='${LOGO}'">${j.nome}</div></td>
        <td>${j.posicao||'—'}</td><td>${j.numero_camisola||'—'}</td></tr>`
      ).join('');
    }
  }

  // Pagamentos — quantos jogadores distintos já pagaram
  const { data: pagamentos } = await sb.from('pagamentos').select('jogador_id');
  if(pagamentos){
    const distintos = new Set(pagamentos.map(p=>p.jogador_id));
    document.getElementById('s-pagos').textContent = distintos.size;
  }

  // Jogos (só os confirmados)
  const RESULTADOS = { vitoria: 'Vitória', empate: 'Empate', derrota: 'Derrota' };
  const { data: jogos } = await sb.from('jogos').select('*').eq('estado','confirmado').order('data_jogo');
  if(jogos && jogos.length){
    document.getElementById('jogos-tbody').innerHTML = jogos.map(j =>
      `<tr><td>${j.data_jogo}</td><td>${j.hora ? j.hora.slice(0,5) : '—'}</td><td><b>vs ${j.adversario||'—'}</b></td><td>${j.local||'—'}</td><td>${j.resultado_estado ? RESULTADOS[j.resultado_estado] : '—'}</td></tr>`
    ).join('');

    const proximo = jogos.find(j => j.data_jogo >= hoje) || jogos[jogos.length-1];
    if(proximo){
      const f = formatarData(proximo.data_jogo);
      const box = document.getElementById('proximo-jogo-box');
      if(box){
        box.innerHTML = `
          <div class="proximo">
            <div class="data"><b>${f.dia}</b><span>${f.mes}</span></div>
            <div class="info"><b>vs ${proximo.adversario||'—'}</b><span>${proximo.hora ? proximo.hora.slice(0,5) : ''} · ${proximo.local||'local a definir'}</span></div>
          </div>`;
      }
    }
  }
}

carregar();
</script>
</body>
</html>
